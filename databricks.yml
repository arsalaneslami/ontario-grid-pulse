# databricks.yml — Ontario Grid Pulse bundle

bundle:
  name: ontario-grid-pulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog where this deployment writes
    default: ogp_dev
  storage_account:
    description: ADLS Gen2 storage account hosting the lakehouse container
    default: ogpcanadacentralsa01
  storage_container:
    description: Blob container under the storage account
    default: lakehouse
  notifications_email:
    description: Email for job/pipeline notifications
    default: arsalan@areslamihotmail.onmicrosoft.com
  schedule_pause_status:
    description: Pause status for scheduled triggers (PAUSED or UNPAUSED)
    default: PAUSED
  warehouse_id:
    description: SQL Warehouse ID used by dashboards
    default: b688d1e304ff9617

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405619435757731.11.azuredatabricks.net
      profile: ogp-dev
    variables:
      catalog: ogp_dev
      schedule_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://adb-7405619435757731.11.azuredatabricks.net
      profile: ogp-dev
      root_path: /Workspace/Users/arsalan@areslamihotmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ogp_prod
      schedule_pause_status: PAUSED
    run_as:
      user_name: arsalan@areslamihotmail.onmicrosoft.com
